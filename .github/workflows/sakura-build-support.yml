name: Sakura Runtime Support
on:
  push:
    branches: [sakura-river-rebuild-20261005]
    paths: ['.github/workflows/sakura-build-support.yml']
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Bundle licensed browser runtime
        run: |
          mkdir -p work/output/vendor work/output/reference
          cd work
          npm init -y
          npm install --save-exact three@0.169.0 esbuild@0.24.0
          cat > entry.js <<'EOF'
          import * as THREE from 'three';
          import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
          import {Water} from 'three/addons/objects/Water.js';
          import {Sky} from 'three/addons/objects/Sky.js';
          import {Reflector} from 'three/addons/objects/Reflector.js';
          import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
          import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
          import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
          import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';
          import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';
          import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
          import {SimplexNoise} from 'three/addons/math/SimplexNoise.js';
          export {THREE,OrbitControls,Water,Sky,Reflector,EffectComposer,RenderPass,UnrealBloomPass,OutputPass,ShaderPass,mergeGeometries,SimplexNoise};
          EOF
          npx esbuild entry.js --bundle --minify --format=iife --global-name=RiverEngine --outfile=output/vendor/river-engine.min.js
          cp node_modules/three/LICENSE output/vendor/THREE-LICENSE.txt
          cp node_modules/three/examples/jsm/objects/Water.js output/reference/Water.js
          cp node_modules/three/examples/jsm/objects/Reflector.js output/reference/Reflector.js
          cp entry.js package.json package-lock.json output/reference/
          curl -L --fail --max-time 45 'https://valley.mengto.here.now/' -o output/reference/site-reference.html || true
          du -sh output/*
      - uses: actions/upload-artifact@v4
        with:
          name: sakura-runtime-support
          path: work/output/
          retention-days: 3
