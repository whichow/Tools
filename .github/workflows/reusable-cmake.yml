name: Reusable CMake CI

on:
  workflow_call:
    inputs:
      source-directory:
        required: false
        type: string
        default: '.'
      build-directory:
        required: false
        type: string
        default: 'build'
      build-type:
        required: false
        type: string
        default: 'Release'
      generator:
        required: false
        type: string
        default: 'Ninja'
      configure-arguments:
        required: false
        type: string
        default: ''
      test-arguments:
        required: false
        type: string
        default: '--output-on-failure'
      artifact-path:
        required: false
        type: string
        default: ''
      artifact-name:
        required: false
        type: string
        default: 'cmake-artifacts'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure
        shell: bash
        run: >-
          cmake
          -S '${{ inputs.source-directory }}'
          -B '${{ inputs.build-directory }}'
          -G '${{ inputs.generator }}'
          -DCMAKE_BUILD_TYPE='${{ inputs.build-type }}'
          ${{ inputs.configure-arguments }}

      - name: Build
        run: cmake --build '${{ inputs.build-directory }}' --config '${{ inputs.build-type }}' --parallel

      - name: Test
        run: ctest --test-dir '${{ inputs.build-directory }}' -C '${{ inputs.build-type }}' ${{ inputs.test-arguments }}

      - name: Upload artifacts
        if: ${{ inputs.artifact-path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.artifact-path }}
          if-no-files-found: error
