name: Reusable Python CI

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: '3.12'
      working-directory:
        required: false
        type: string
        default: '.'
      install-command:
        required: false
        type: string
        default: 'python -m pip install -r requirements.txt'
      test-command:
        required: false
        type: string
        default: 'pytest -q'
      artifact-path:
        required: false
        type: string
        default: ''
      artifact-name:
        required: false
        type: string
        default: 'python-artifacts'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip
      - name: Install dependencies
        run: ${{ inputs.install-command }}
      - name: Compile check
        run: python -m compileall -q .
      - name: Test
        run: ${{ inputs.test-command }}
      - uses: actions/upload-artifact@v4
        if: ${{ inputs.artifact-path != '' }}
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ inputs.working-directory }}/${{ inputs.artifact-path }}
          if-no-files-found: error
