name: Reusable Android CI

on:
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: '17'
      working-directory:
        required: false
        type: string
        default: '.'
      gradle-task:
        required: false
        type: string
        default: 'assembleDebug'
      artifact-name:
        required: false
        type: string
        default: 'android-build'
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ inputs.java-version }}
          cache: gradle
      - uses: gradle/actions/setup-gradle@v4
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew
      - name: Build
        run: ./gradlew ${{ inputs.gradle-task }} --stacktrace
      - name: Collect APK/AAB
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/android-artifacts"
          find . -type f \( -name '*.apk' -o -name '*.aab' \) -print -exec cp {} "$RUNNER_TEMP/android-artifacts/" \;
          if [ -z "$(find "$RUNNER_TEMP/android-artifacts" -type f -maxdepth 1)" ]; then
            echo 'No APK/AAB files found.'
            exit 1
          fi
          (cd "$RUNNER_TEMP/android-artifacts" && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/android-artifacts
          if-no-files-found: error
