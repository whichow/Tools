name: Reusable Release

on:
  workflow_call:
    inputs:
      artifact-pattern:
        required: false
        type: string
        default: '*'
      release-name:
        required: false
        type: string
        default: ''
      prerelease:
        required: false
        type: boolean
        default: false

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ${{ inputs.artifact-pattern }}
          merge-multiple: true
          path: release-assets
      - name: Generate checksums
        shell: bash
        run: |
          cd release-assets
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS.txt || true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ inputs.release-name != '' && inputs.release-name || github.ref_name }}
          prerelease: ${{ inputs.prerelease }}
          generate_release_notes: true
          files: release-assets/*
